[project]
name = "payoutproof"
version = "0.1.0"
description = "PayoutProof: Trust Agent and Deterministic Policy Gate for Payment Risk"
readme = "README.md"
authors = [
    { name = "KunalKumarMehta", email = "kunalkumarmehta.pro+github@gmail.com" }
]
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.7.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.30.0",
    "pyyaml>=6.0",
    "cryptography>=42.0.0",
    "httpx>=0.27.0",
    "rich>=13.7.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "ruff>=0.5.0",
]

[project.scripts]
payoutproof = "payoutproof.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W"]
ignore = ["E501", "F401"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["F811", "F841", "E402"]

